name: Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release: ${{ steps.metadata.outputs.release }}
      artifact_name: release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the requested source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Plan the version from unpublished commits
        id: metadata
        run: node scripts/release.mjs prepare

      - name: Test release version rules
        run: node --test tests/release.test.mjs

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check generator types
        run: pnpm check

      - name: Build generator
        run: pnpm build

      - name: Test generator
        run: pnpm test

      - name: Test Git integration
        run: pnpm test:git

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false

      - name: Test generated API
        working-directory: template/api
        run: |
          go test ./...
          go vet ./...
          go build -o bin/server ./cmd/server

      - name: Install generated admin dependencies
        working-directory: template/admin
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Check generated admin
        working-directory: template/admin
        run: |
          pnpm lint
          pnpm check
          pnpm test
          pnpm build

      - name: Test the exact release tarball
        env:
          TEMVIA_TEST_TARBALL: ${{ github.workspace }}/.release/create-temvia-${{ steps.metadata.outputs.version }}.tgz
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TEMVIA_TEST_TARBALL")"
          pnpm test:package
          test -s "$TEMVIA_TEST_TARBALL"

      - name: Run the mandatory first-run acceptance on the tested tarball
        env:
          TEMVIA_TEST_TARBALL: ${{ github.workspace }}/.release/create-temvia-${{ steps.metadata.outputs.version }}.tgz
        run: node scripts/first-run-acceptance.mjs "$TEMVIA_TEST_TARBALL"

      - name: Record and upload the tested tarball
        id: artifact
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$GITHUB_WORKSPACE/.release/create-temvia-$RELEASE_VERSION.tgz"
          (cd "$(dirname "$tarball")" && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256")
          cat "$tarball.sha256"

      - name: Upload the tested tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.release/create-temvia-${{ steps.metadata.outputs.version }}.tgz
            ${{ github.workspace }}/.release/create-temvia-${{ steps.metadata.outputs.version }}.tgz.sha256
            ${{ github.workspace }}/.release/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish and smoke test
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/create-temvia
    permissions:
      contents: write
    steps:
      - name: Check out the verified source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Download the tested tarball
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: .release

      - name: Verify the downloaded tarball
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd .release
          sha256sum -c "create-temvia-$RELEASE_VERSION.tgz.sha256"

      - name: Require the npm publishing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo 'The npm environment must provide NPM_TOKEN before publishing.' >&2
            exit 1
          fi

      - name: Publish the tested tarball and record the source tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs publish

      - name: Create the GitHub release and attach verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs finalize

      - name: Wait for the public latest version
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          latest=''
          for attempt in $(seq 1 36); do
            latest="$(npm view create-temvia@latest version --registry "$NPM_CONFIG_REGISTRY" 2>/dev/null || true)"
            if [ "$latest" = "$RELEASE_VERSION" ]; then
              break
            fi
            sleep 5
          done
          if [ "$latest" != "$RELEASE_VERSION" ]; then
            echo "The public latest version did not become $RELEASE_VERSION in time." >&2
            exit 1
          fi

      - name: Generate through the public pnpm create entry point
        env:
          CI: 'true'
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          public_npmrc="$RUNNER_TEMP/temvia-public.npmrc"
          : > "$public_npmrc"
          generated=false
          for attempt in $(seq 1 12); do
            project_dir="$smoke_dir/project-$attempt"
            if NPM_CONFIG_USERCONFIG="$public_npmrc" pnpm create temvia@latest "$project_dir" --module github.com/jonathanhu237/temvia-smoke/api; then
              generated=true
              break
            fi
            echo "Public generation attempt $attempt/12 failed." >&2
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          if [ "$generated" != true ]; then
            echo 'Public generation failed after 12 attempts.' >&2
            exit 1
          fi
          test -f "$project_dir/README.md"
          test -f "$project_dir/README.zh-CN.md"
          test -f "$project_dir/LICENSE"
          grep -Fx 'module github.com/jonathanhu237/temvia-smoke/api' "$project_dir/api/go.mod"
