services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-temvia}
      POSTGRES_USER: ${POSTGRES_USER:-temvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - temvia-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.10.1-trixie
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --appendonly
      - 'no'
      - --save
      - ''
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - volatile-lru
    deploy:
      resources:
        limits:
          memory: ${REDIS_CONTAINER_MEMORY_LIMIT:-256m}
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379

  migrate:
    build:
      context: ./api/migrations
      dockerfile: Dockerfile
    profiles: [tools]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-temvia}
      PGUSER: ${POSTGRES_USER:-temvia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGSSLMODE: ${POSTGRES_SSLMODE:-disable}
    command:
      - up

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      HTTP_ADDR: ${HTTP_ADDR:-0.0.0.0:8080}
      SETUP_LINK_TTL: ${SETUP_LINK_TTL:-30m}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-temvia}
      POSTGRES_USER: ${POSTGRES_USER:-temvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-0s}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
      REDIS_CONTAINER_MEMORY_LIMIT: ${REDIS_CONTAINER_MEMORY_LIMIT:-256m}
      REDIS_OPERATION_TIMEOUT: ${REDIS_OPERATION_TIMEOUT:-1s}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-12h}
      PASSWORD_HASH_MAX_CONCURRENCY: ${PASSWORD_HASH_MAX_CONCURRENCY:-2}
      LOGIN_RATE_LIMIT_GLOBAL_CAPACITY: ${LOGIN_RATE_LIMIT_GLOBAL_CAPACITY:-10}
      LOGIN_RATE_LIMIT_GLOBAL_REFILL_INTERVAL: ${LOGIN_RATE_LIMIT_GLOBAL_REFILL_INTERVAL:-6s}
      LOGIN_RATE_LIMIT_EMAIL_CAPACITY: ${LOGIN_RATE_LIMIT_EMAIL_CAPACITY:-5}
      LOGIN_RATE_LIMIT_EMAIL_REFILL_INTERVAL: ${LOGIN_RATE_LIMIT_EMAIL_REFILL_INTERVAL:-1m}
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:${ADMIN_PORT:-5173}:8080
    depends_on:
      api:
        condition: service_started

volumes:
  temvia-postgres:
